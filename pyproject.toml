[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brispy"
version = "0.2.0"
description = "A wrapper for Brisnet single-file past-performance data files."
authors = [
    { name = "Matt" }
]
readme = "README.md"
license = { text = "GPL" }
requires-python = ">=3.12"
dependencies = [
]

[project.optional-dependencies]
test = ["coverage>=7.6"]

[tool.setuptools.packages.find]
include = ["brispy*"]

[tool.setuptools.package-data]
"brispy" = ["py.typed"]
"brispy.singlefile.tests" = ["*.DRF"]

[tool.coverage.run]
branch = true
source = ["brispy"]
omit = ["brispy/singlefile/tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
